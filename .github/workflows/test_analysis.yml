name: Test Analysis

on:
  pull_request:
    branches: [main, zarr3]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space (max safe)
        run: |
          echo "=== BEFORE CLEANUP ==="
          df -h

          # big toolchains + languages
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/share/dotnet \
                      /opt/ghc \
                      /usr/local/lib/android \
                      /opt/hostedtoolcache

          # browsers + automation frameworks
          sudo rm -rf /usr/lib/playwright \
                      /usr/lib/chromium \
                      /usr/bin/google-chrome \
                      /usr/bin/chromedriver

          # azure cli
          sudo rm -rf /usr/lib/azure-cli \
                      /opt/az

          # caches
          sudo rm -rf ~/.cache

          # docker cleanup
          sudo docker system prune -af || true

          echo "=== AFTER CLEANUP ==="
          df -h

      # Set up Conda
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.12
          channels: conda-forge

      # Set up environment
      - name: Set up brieflow environment
        shell: bash -l {0}
        run: |
          # Create conda environment
          conda create -n brieflow_ci -c conda-forge python=3.12 uv pip -y
          conda activate brieflow_ci
          
          # Install Python dependencies with uv
          uv pip install -r pyproject.toml
          uv pip install -e .

      # Activate environment for subsequent steps
      - name: Initialize conda environment
        shell: bash -l {0}
        run: |
          conda activate brieflow_ci
          echo "CONDA_DEFAULT_ENV=brieflow_ci" >> $GITHUB_ENV

      # Run setup for small test analysis
      - name: Run small test setup
        shell: bash -l {0}
        working-directory: tests/small_test_analysis
        run: |
          conda activate brieflow_ci
          python small_test_analysis_setup.py

      # Run Brieflow on the small test (OME-Zarr output; TIFF is checked against it before each release)
      - name: Run Brieflow (zarr)
        shell: bash -l {0}
        working-directory: tests/small_test_analysis
        run: |
          conda activate brieflow_ci
          mkdir -p "$PWD/tmp"
          export TMPDIR="$PWD/tmp"
          bash run_brieflow.sh --zarr
